name: yolo-detect-v4-ddp
version: 1
entry_point: scripts/36b_train_yolo_v4_ddp_wsl2.py
description: >
  Multi-node YOLOv8s detection training on the yolo_detect_v4 dataset,
  via PyTorch DistributedDataParallel over WSL2 + NCCL. Root-caused this
  session: native Windows PyTorch has no NCCL backend at all; this job
  must run inside each machine's WSL2, not natively.

requires:
  min_gpu_memory_gb: 8
  dataset: yolo_detect_v4
  python_env: yolo_ddp_env

roles:
  rank_assignment: coordinator-assigned  # coordinator.py dispatch computes rank 0..N-1 from workers.yaml order

runtime: wsl2  # worker_daemon.py launches this via `wsl.exe -d <distro> -- bash -lc "... torchrun ..."`,
               # not sys.executable directly -- native Windows PyTorch has no NCCL backend at all
               # (see the entry_point script's docstring). See WSL2_ENTRY_POINTS in worker_daemon.py.

env:
  PER_GPU_BATCH: "{auto}"   # placeholder for coordinator-computed value
  MASTER_PORT: "29500"
